[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycircuits-sim"
version = "0.1.0"
description = "A small, modular power-electronics simulation backend"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "plotly>=5.24", "streamlit>=1.40", "streamlit-flow-component>=1.6"]

[project.scripts]
pycircuits-sim = "pycircuits_sim.cli:main"

[tool.setuptools.packages.find]
include = ["pycircuits_sim*"]
